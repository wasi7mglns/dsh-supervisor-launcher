name: launcher-build

# 公开壳仓产线（2026-09 双仓拆分定案）：本仓=壳（src-tauri 引导器形态，MIT 可独立构建）。
# tag v<壳版本> / push main → 逐平台 Tauri bundle → 安装程序（Linux .deb/.AppImage 等）挂 GitHub Release。
on:
  push:
    branches: [main]
    tags: ['v*']            # tag push 触发挂 Release（此前缺失，tag 从不会触发 CI）
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write   # action-gh-release 挂 Release + 资产上传需 GITHUB_TOKEN contents:write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: win-x64
          - os: macos-latest
            artifact: darwin-arm64
          # darwin-x64：GitHub 已无 Intel macOS runner（macos-13 弃用）——原生 Rust 无法像 JS
          # 那样跨 arch override，x64 macOS 安装包暂缺（与内核 darwin-x64 元数据包不同，需真 Intel 机器）。
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node（--node-plan 冒烟用）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps (Tauri v2)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # runner 镜像自带的第三方源（dl.google.com 等）常报 Hash Sum mismatch，与构建无关——
          # 直接删除其源文件（含 deb822 .sources 格式），只留 Ubuntu 官方源，update 必须成功。
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/google*.sources 2>/dev/null || true
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: 壳无头冒烟（--node-plan：环境探针 + 官方最新 LTS）
        shell: bash
        run: |
          cargo build 2>&1 | tail -2
          ./target/debug/dsh-supervisor-gui --node-plan || true
        working-directory: src-tauri

      - name: Build + bundle (Tauri)
        run: npx --yes @tauri-apps/cli@2 build

      # 只上传/挂载真正的安装程序文件（.deb/.AppImage/.dmg/.msi）。
      # 修复：原 `bundle/**/*` 会把 bundle 下 .app 目录（macOS）、AppImage 解包 AppDir、
      # deb/appimage 构建中间产物（全部 WebKit/GTK .so、gschema、im-module 等数百文件）
      # 一并递归匹配上传——Release 页被 238 个垃圾资产淹没、artifact 膨胀到 186MB。
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Attach installers to GitHub Release（tag 触发时）
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true