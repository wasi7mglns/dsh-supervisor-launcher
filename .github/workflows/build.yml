name: launcher-build

# 公开壳仓产线（2026-09 双仓拆分定案）：本仓=壳（src-tauri 引导器形态，MIT 可独立构建）。
# 矩阵 → 逐平台 Tauri bundle → 安装包挂 GitHub Release + 发布 npm 包（自更新产物）。
#
# ── 触发策略（2026-09 修复 F5：原 push main 会每次全平台构建，浪费额度）──
#   仅 tag / 手动；日常 push main 不再触发（壳为低频发布组件）。
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

# ── 平台矩阵（2026-09 跨平台审计定案）──
#  1) Linux **基座固定 ubuntu-22.04**（glibc 2.35）——F1 必修：
#     实测在 Ubuntu 24.04(glibc 2.39) 构建的产物**无法**在 Ubuntu 22.04 / Debian 12 运行
#     （根因：Rust std process 模块对 pidfd_spawnp/pidfd_getpid 的弱引用在 2.39 主机会被解析
#      成硬性 verneed）。在 2.35 基座链接则不产生该需求 → 兼容 22.04+/Debian 12+。
#  2) Linux 已**废弃 AppImage**（改用标准 deb/rpm）。
#  3) macOS 双架构**原生**构建：arm64 用 macos-latest，x64 用 **macos-15-intel**
#     （实测该 runner 存在；旧注释「GitHub 已无 Intel macOS runner」已过时）。注意 macos-14 已弃用。
#  4) Windows 主推 NSIS per-user（免提权 + 可静默更新），MSI 作备选。
jobs:
  # 版本单源：从 tauri.conf.json 读取，供下游组装/发布使用（避免各 job 各写一遍）
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        # 必须用块标量：行内写法中的 \" 会破坏 $( ) 的引号配对，
        # 实测报 syntax error near unexpected token `(`（CI run #16 即因此失败）。
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    permissions:
      contents: write   # action-gh-release 挂 Release + 资产上传
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x64
            bundles: deb,rpm
            glibc_max: "2.35"
          # Linux arm64（可选；如需开启，去掉下方注释并在 N2b 决策中确认）
          # - os: ubuntu-22.04-arm
          #   artifact: linux-arm64
          #   bundles: deb,rpm
          #   glibc_max: "2.35"
          - os: windows-latest
            artifact: win-x64
            bundles: nsis,msi
            glibc_max: ""
          - os: macos-latest
            artifact: darwin-arm64
            bundles: app,dmg
            glibc_max: ""
          - os: macos-15-intel
            artifact: darwin-x64
            bundles: app,dmg
            glibc_max: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node（--node-plan 冒烟用）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 关键：缓存键必须区分 runner 镜像。
          # 默认键只含 OS（Linux 不细分发行版），于是 ubuntu-latest(=24.04) 的 target/ 与
          # -sys 的 pkg-config 探测结果会被 ubuntu-22.04 复用到 —— 缓存里的构建脚本输出
          # 指向 24.04 的库路径/特性集，导致 gtk 这类 -sys 生成绑定大量不匹配
          # （实测表现为「gtk: 425 errors」，与缺依赖的错误形态极难区分）。
          key: ${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Linux system deps (Tauri v2 + rpm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # runner 镜像自带的第三方源（dl.google.com 等）常报 Hash Sum mismatch，与构建无关——
          # 直接删除其源文件（含 deb822 .sources 格式），只留 Ubuntu 官方源，update 必须成功。
          sudo rm -f /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/google*.sources 2>/dev/null || true
          sudo apt-get update -y
          # webkit2gtk-4.1：Tauri v2 的 Linux webview 依赖（Ubuntu 22.04 已提供该 ABI，实测）
          # 显式列出 GUI 栈的 -dev 包（不依赖传递依赖）：gtk-rs 的 -sys crate 通过 pkg-config 探测，
          # 缺任一个都会在编译期炸出大量错误；实测在 ubuntu-22.04 上表现为「gtk 425 errors」。
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libglib2.0-dev libcairo2-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf-2.0-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config \
            rpm           # rpm 打包需要 rpmbuild

      # ── 门禁测试（P1-B 接线，2026-09-12）──
      #
      # ⚠ 为什么必须单独一步：本仓 60+ 个门禁（G1/G1'/G2/G3/G5、B1–B56）与
      #   平台矩阵自检**此前从未在 CI 执行** —— 只有 `updater_artifacts` 被跑过。
      #   而 README 声称「壳的跨平台与引导行为由测试保障（cargo test…B1–B55）」，
      #   DESIGN 更写着「没有门禁的规范等于没有规范」。
      #   于是跨平台约束在产线上退化为注释：改坏 platform/ 也不会被拦住。
      #
      # 覆盖（均为**无外部依赖**目标，可安全在 CI 跑）：
      #   · bootstrap_flow    —— G1/G1'/G2/G3/G5 + B1–B56（分层 + 引导流程 + 前端语法）
      #   · update_guard_test —— G6（自更新护栏不得永久自锁，P1-A）
      #   · 单元测试          —— error/bounded/core/node/nodeprobe 内嵌 #[cfg(test)]
      # 注：`updater_artifacts` 需要 SHELL_REHEARSAL_DIR（打包产物），
      #     故仍在下方「产物验收」步骤单独跑，不并入本步。
      - name: 门禁测试（G1–G6 + B1–B56 + 单元）
        shell: bash
        run: |
          # 不截断：门禁失败时断言文案就是排障依据（与上一步同理）。
          set -o pipefail
          # ⚠ 不用 `--lib`：本包是 **bin crate**（无 library target），
          #   `--lib` 会直接 `error: no library targets found` 并退出 101。
          #   `--bins` 覆盖 src 内嵌的 #[cfg(test)] 单元测试。
          # G6-i/j 与 U-a..d 分别锁定「跨仓 probe 超时单一事实源」「SHA 清单失败不中断回退」
          # 与「未知平台实现的 trait 方法归属」——后者尤其重要：该模块被
          # #[cfg(not(any(linux,macos,windows)))] 排除，三大平台构建根本不编译它，
          # 故**只有静态结构门禁**能拦住「方法放错 impl 块」这类缺陷。
          cargo test --bins --test bootstrap_flow --test update_guard_test \
            --test platform_unsupported_structure_test 2>&1 | tail -80
        working-directory: src-tauri

      - name: 壳无头冒烟（--node-plan：环境探针 + 官方最新 LTS）
        shell: bash
        run: |
          # 不要截断到 tail -2：曾因此在 CI 只看到「gtk 425 errors」的汇总行、看不到任何真实错误，
          # 排障必须反复烧 CI。保留足够上下文但仍然有界。
          cargo build 2>&1 | tail -60
          ./target/debug/dsh-supervisor-gui --node-plan || true
        working-directory: src-tauri

      - name: Build + bundle (Tauri)
        shell: bash
        env:
          # 签名密钥（发布必须签名：Tauri updater 强制验签，不可关闭）
          # 未配置 secret 时为空 → 仅构建不产 .sig（开发/验证场景不阻断）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置 —— 不生成 .sig，产物不可用于自动更新"
          fi
          npx --yes @tauri-apps/cli@2 build --bundles "${{ matrix.bundles }}"

      # ── glibc 基座门禁（Linux only）──
      # 防止「在新基座构建 → 只能装新发行版」的缺陷回归（F1 实测教训）。
      - name: glibc 基座门禁（Linux）
        if: runner.os == 'Linux' && matrix.glibc_max != ''
        shell: bash
        run: |
          BIN=src-tauri/target/release/dsh-supervisor-gui
          test -f "$BIN" || { echo "找不到产物 $BIN"; exit 1; }
          # 门禁脚本随壳仓携带（由内核 ci/check-glibc.sh 单源导出）
          bash ci/check-glibc.sh "$BIN" "${{ matrix.glibc_max }}"

      # ── 组装可发布的 npm 包（产物 + .sig + 清单条目）──
      # 说明：Tauri 的 {{target}}/{{arch}} 取值与 npm 命名不同，故用静态清单解耦；
      #       组装器负责把「安装包 + .sig」成对收拢，并在缺 .sig 时**直接失败**
      #       （缺签名 = 自动更新不可用，必须早失败而非静默发布）。
      - name: 组装 npm 包（更新产物 + 签名）
        shell: bash
        run: |
          node shell-release/assemble-shell-pkg.js             --platform "${{ matrix.artifact }}"             --ver "${{ needs.version.outputs.ver }}"             --bundle-dir src-tauri/target/release/bundle             --out dist/npm-shell

      # ── 产物验收（本地端到端预演的 CI 化）──
      # 用 **Tauri 自己的依赖** 验证我们产出的东西正是 Tauri 会接受的东西：
      #   · minisign-verify —— tauri-plugin-updater 内部使用的同一个 crate
      #   · tauri_plugin_updater::RemoteRelease —— Tauri 自己的清单解析器
      # 覆盖：清单可解析 / 签名与配置公钥匹配 / 篡改必失败 / 换公钥必失败。
      # 这一步失败 = 产物不可用于自动更新 → 必须早失败，绝不静默发布。
      - name: 产物验收（Tauri 同源验签 + 清单契约）
        shell: bash
        env:
          # 必须绝对路径：本步骤 working-directory=src-tauri，相对路径会解析到 src-tauri/ 下
          SHELL_REHEARSAL_DIR: ${{ github.workspace }}/dist/npm-shell
        run: |
          cargo test --test updater_artifacts -- --nocapture --test-threads=1
        working-directory: src-tauri

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # 只上传真正的安装程序 + 更新产物（.sig）。
          # 不用 bundle/**/*（会把 .app 目录、AppDir、构建中间产物全部递归上传，曾致 238 个垃圾资产）。
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*.sig
            dist/npm-shell/**
          if-no-files-found: warn

      - name: Attach installers to GitHub Release（tag 触发时）
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*.sig
          generate_release_notes: true

  # ── 发布 job：汇总各平台产物 → 生成 Tauri 静态清单 → 发布到 npm ──
  # 仅在 tag 触发时执行（日常构建只做验证与产物上传）。
  publish:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts

      - name: 归拢 npm 包目录
        shell: bash
        run: |
          mkdir -p dist/npm-shell
          # upload-artifact 保留上传时的相对路径：上传 dist/npm-shell/**，
          # 下载后落在 <artifact>/dist/npm-shell/**（不是 <artifact>/npm-shell）。
          # 两种形态都兼容，避免路径假设变化导致静默归拢为空。
          for d in dist/artifacts/*/; do
            for cand in "$d/dist/npm-shell" "$d/npm-shell"; do
              [ -d "$cand" ] && cp -r "$cand/." dist/npm-shell/
            done
          done
          echo "=== 归拢后的包目录 ==="
          find dist/npm-shell -maxdepth 2 -type d | sort
          # 断言：至少 linux-x64 必须归拢成功。与其让后续产出空清单，
          # 不如在此明确失败并打印实际布局。
          if [ ! -d dist/npm-shell/@dsh-sup/shell-linux-x64 ]; then
            echo "::error::未归拢到 shell-linux-x64，artifact 路径假设可能有误"
            echo "--- dist/artifacts 实际布局 ---"
            find dist/artifacts -maxdepth 4 -type d | head -40
            exit 1
          fi
      - name: 生成 shell-manifest.json（Tauri 静态清单）
        shell: bash
        run: |
          node shell-release/make-manifest.js \
            --ver "${{ needs.version.outputs.ver }}" \
            --entries dist/npm-shell \
            --out dist/npm-shell/shell-manifest.json

      - name: 校验清单
        shell: bash
        run: |
          node -e "
          const m = require('./dist/npm-shell/shell-manifest.json');
          const keys = Object.keys(m.platforms);
          console.log('版本:', m.version, '平台:', keys.join(', '));
          if (!keys.length) { console.error('清单为空'); process.exit(1); }
          for (const k of keys) {
            const p = m.platforms[k];
            if (!p.url || !p.signature) { console.error('缺 url/signature: ' + k); process.exit(1); }
          }
          console.log('✅ 清单校验通过');
          "

      - name: 发布平台子包 + 清单包到 npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          VER="${{ needs.version.outputs.ver }}"
          TAG=""
          case "$VER" in
            *-BETA.*) TAG="--tag beta" ;;
            *-RC.*)   TAG="--tag rc" ;;
          esac
          for d in dist/npm-shell/@dsh-sup/shell-*; do
            [ -d "$d" ] || continue
            echo "== 发布 $(node -p "require('./$d/package.json').name") =="
            (cd "$d" && npm publish --access public $TAG)
          done
          REL=dist/npm-shell/@dsh-sup/shell-release
          mkdir -p "$REL"
          cp dist/npm-shell/shell-manifest.json "$REL/"
          node -e "
          const fs=require('fs');
          fs.writeFileSync('$REL/package.json', JSON.stringify({
            name:'@dsh-sup/shell-release', version:'$VER',
            description:'DSH supervisor desktop shell update manifest (Tauri updater static JSON).',
            license:'MIT', files:['shell-manifest.json']
          }, null, 2) + '\n');
          "
          (cd "$REL" && npm publish --access public $TAG)
