[package]
name = "dsh-supervisor-gui"
version = "0.1.0"
description = "DSH lifecycle guard desktop shell (env bootstrap + panel)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# embedded-panel：完整壳（frontendDist=frontend，内嵌闭源面板产物；内核仓本地构建）。
# 公开壳（MIT 引导器，frontendDist=bootstrap）构建时用 --no-default-features：go_panel 导航守卫 3100。
default = ["embedded-panel"]
embedded-panel = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
