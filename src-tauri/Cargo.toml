[package]
name = "dsh-supervisor-gui"
version = "0.1.0"
description = "DSH lifecycle guard desktop shell (env bootstrap + panel)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 公开壳（MIT 引导器，frontendDist=bootstrap，2026-09 双仓拆分定案）。
# 说明：embedded-panel 完整壳（内嵌闭源面板产物 frontend/）已随拆分留在内核仓本地，
# 公开壳仓不自带 default feature——纯引导器形态，自足可独立构建 .deb/.AppImage。
embedded-panel = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
