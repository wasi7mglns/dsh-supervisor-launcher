[package]
name = "dsh-supervisor-gui"
version = "0.1.0"
description = "DSH lifecycle guard desktop shell (env bootstrap + panel)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 分体架构（2026-09-07 定案）：壳=自绘窗口容器 + 引导器；面板由内核 :3100 托管。
# 无 feature 即标准形态：frontendDist=bootstrap；go_panel → emit shell:goto-panel 切内容区。
default = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
