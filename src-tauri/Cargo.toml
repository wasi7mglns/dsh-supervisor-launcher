[package]
name = "dsh-supervisor-gui"
version = "1.0.1"
description = "DSH lifecycle guard desktop shell (env bootstrap + panel)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 公开壳（MIT 引导器，frontendDist=bootstrap，2026-09 双仓拆分定案）。
# 说明：embedded-panel 完整壳（内嵌闭源面板产物 frontend/）已随拆分留在内核仓本地，
# 公开壳仓不自带 default feature——纯引导器形态，自足可独立构建 .deb/.AppImage。
embedded-panel = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
# 桌面壳自更新（门 0）：Tauri 官方更新器 —— 强制 minisign 验签（不可关闭），
# 平台安装语义（Linux pkexec dpkg -i / macOS .app 替换 / Windows NSIS passive）由插件内部处理，
# 壳侧不写任何平台分支（跨平台行为一致性由此保证）。
tauri-plugin-updater = "2"
# app.restart()：更新安装后重启进入新版本（旧进程装、新进程跑）。
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
# 发布产物验收（tests/updater_artifacts.rs）：
# 必须使用 **Tauri 自己用的同一个验签库**，否则测的不是真实链路。
minisign-verify = "0.2"
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
