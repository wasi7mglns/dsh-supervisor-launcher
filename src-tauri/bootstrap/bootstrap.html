<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-supervisor — 环境引导</title>
<style>
  /* ============================================================
   * dsh-supervisor 引导页 —— 加载页 DNA × 小圈 stepper 融合（2026-09-07 定稿）
   * 壳窗口栏(40px) 之下：
   *   加载页氛围做底（素白 + 顶部品牌光晕）
   *   上方：居中 64px 大 LOGO 圆 + 旋转环 + DSH-SUP + 实时状态
   *   下方：原「小圈一步步」横向流程条（检测→Node.js→守卫内核→打开面板）
   *   需操作时：步骤下方浮现按钮
   * ============================================================ */
  :root {
    --brand: #2F54EB; --brand-soft: rgb(47 84 235 / 12%);
    --text: #0F1115; --status: #6b747d; --line: #DDE3EC;
    --ok: #10b981; --danger: #b42318; --border: rgb(0 0 0 / 8%);
  }
  @media (prefers-color-scheme: dark) {
    :root { --brand: #6b83ff; --brand-soft: rgb(107 131 255 / 18%);
      --text: #f1f4f9; --status: #9aa3ad; --line: #262b36;
      --ok: #34d399; --danger: #f87171; --border: rgb(255 255 255 / 14%); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; height: 100dvh; }
  body { margin: 0; background: transparent; color: var(--text); overflow: hidden;
    font-family: Inter, "Noto Sans SC", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* ── 壳窗口栏（唯一，顶部固定） ── */
    height: 40px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(251,252,254,0.92); border-bottom: 1px solid var(--border);
    user-select: none; -webkit-user-select: none;
  }
    display: flex; align-items: center; gap: 8px; padding: 0 14px; }
    color: var(--status); font-size: 15px; cursor: pointer; line-height: 1; font-family: inherit; }

  /* ── 加载页氛围底（整屏） ── */
  .page {
    width: 100%; height: 100%;
    display: grid; grid-template-rows: 1fr auto auto 1fr;
    justify-items: center; align-items: center;
    background: radial-gradient(circle at 50% 34%, var(--brand-soft), transparent 36%), #FAFBFC;
  }
  @media (prefers-color-scheme: dark) {
    .page { background: radial-gradient(circle at 50% 34%, rgb(107 131 255 / 14%), transparent 36%), #0f1115; }
  }
  .page-inner { grid-row: 2 / 4; display: grid; justify-items: center; gap: 26px;
    width: min(520px, calc(100% - 60px)); }

  /* ── 上方：大 LOGO + 品牌（内核加载页 DNA） ── */
  .brand { display: grid; justify-items: center; gap: 14px; }
  .startup-logo {
    position: relative; display: grid; width: 68px; height: 68px; place-items: center;
    border: 1px solid rgb(47 84 235 / 14%); border-radius: 999px;
    background: linear-gradient(145deg, rgb(255 255 255 / 96%), rgb(239 245 242 / 92%));
    box-shadow: 0 18px 42px rgb(15 23 42 / 10%), inset 0 1px 0 rgb(255 255 255 / 90%);
    color: var(--brand);
  }
  .startup-logo::after {
    position: absolute; inset: -8px; content: ""; border-radius: 999px;
    border: 2px solid rgb(47 84 235 / 10%); border-top-color: var(--brand);
    animation: startup-spin 960ms linear infinite;
  }
  .startup-logo.done::after { animation: none; border-color: rgb(16 185 129 / 30%); border-top-color: var(--ok); }
  .startup-logo-image { width: 44px; height: 44px; background: currentColor;
    mask: url("/dsh-logo.svg") center / contain no-repeat;
    -webkit-mask: url("/dsh-logo.svg") center / contain no-repeat; }
  .startup-name { color: var(--text); font-size: 22px; font-weight: 760; line-height: 1; letter-spacing: .02em; }
  .startup-status { color: var(--status); font-size: 13px; line-height: 1.5; text-align: center; }
  .startup-status b { color: var(--text); font-weight: 600; }

  /* ── 下方：小圈 stepper（原一步步流程） ── */
  .stepper { display: flex; align-items: flex-start; justify-content: center; }
  .step { display: flex; flex-direction: column; align-items: center; width: 108px; position: relative; }
  .step-dot {
    position: relative; width: 30px; height: 30px; border-radius: 50%; z-index: 2;
    display: grid; place-items: center;
    background: #fff; border: 2px solid var(--line); color: var(--status);
    transition: all .3s ease;
  }
  @media (prefers-color-scheme: dark) { .step-dot { background: #16191f; } }
  .step-dot .n { font-size: 12px; font-weight: 600; }
  .step.done .step-dot { border-color: var(--ok); color: var(--ok); }
  .step.done .step-dot .svg-ok { display: block; }
  .step.done .step-dot .n { display: none; }
  .step.active .step-dot { border-color: var(--brand); color: var(--brand); }
  .step .step-dot .svg-ok { display: none; }
  .step .ring { display: none; }
  .step.active .ring {
    display: block; position: absolute; inset: -4px; border-radius: 50%;
    background: conic-gradient(var(--brand) calc(var(--p,0)*1%), transparent 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
  }
  .step-label { margin-top: 8px; font-size: 11.5px; color: var(--status); text-align: center; line-height: 1.3; }
  .step.active .step-label { color: var(--text); font-weight: 600; }
  .step.done .step-label { color: var(--status); }
  .step:not(:last-child)::after {
    content: ''; position: absolute; top: 14px; left: calc(50% + 19px); right: calc(-50% + 19px);
    height: 2px; background: var(--line); z-index: 1;
  }
  .step.done:not(:last-child)::after { background: var(--ok); opacity: .45; }

  /* ── 细进度条（加载页 DNA，叠加于 stepper 下方/安装时） ── */
  .progress-row { display: grid; gap: 4px; width: 100%; justify-items: center; }
  .startup-progress { position: relative; width: min(320px, 100%); height: 3px;
    overflow: hidden; border-radius: 999px; background: var(--line); }
  .startup-progress.indet::after { display: block; width: 42%; height: 100%; content: "";
    animation: startup-progress 1.15s ease-in-out infinite; border-radius: inherit; background: var(--brand); }
  .startup-progress.det .fill { display: block; width: 0; height: 100%;
    background: var(--brand); border-radius: inherit; transition: width .25s; }
  .startup-progress .fill { display: none; }
  .pct { color: var(--status); font-size: 11px; font-variant-numeric: tabular-nums; }

  /* ── 操作按钮（Node 缺失/旧时浮现） ── */
  .actions { display: grid; gap: 8px; width: 100%; justify-items: center; }
  .btn { width: 260px; padding: 10px; border: 0; border-radius: 9px;
    background: linear-gradient(180deg, #3d5ef0 0%, #2f54eb 100%);
    color: #fff; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    box-shadow: 0 1px 2px rgb(15 23 42 / 16%), inset 0 1px 0 rgb(255 255 255 / 22%); }
  .btn:hover:not(:disabled) { filter: brightness(1.05); }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--brand); box-shadow: none; }
  .btn.ghost:hover { background: rgb(47 84 235 / 7%); }
  pre.log { display: none; width: min(420px, 100%); max-height: 80px; overflow: auto;
    background: #0b0e14; color: #8ee6b0; border-radius: 8px; padding: 8px 10px; font-size: 11px;
    line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
  .err { display: none; background: #fee2e2; color: var(--danger); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; max-width: 100%; }
  @keyframes startup-spin { to { transform: rotate(360deg); } }
  @keyframes startup-progress { 0% { transform: translateX(-120%); } 100% { transform: translateX(260%); } }
</style>
</head>
<body>
  <div class="page">
    <div class="page-inner">
      <!-- 大 LOGO + 品牌（加载页 DNA） -->
      <div class="brand">
        <div class="startup-logo" id="logo" aria-hidden="true"><span class="startup-logo-image"></span></div>
        <div class="startup-name">DSH-SUP</div>
        <div class="startup-status" id="status">正在检测环境…</div>
      </div>

      <!-- 小圈一步步流程（stepper） -->
      <div class="stepper" id="stepper" style="display:none">
        <div class="step active" id="st-env">
          <div class="step-dot"><span class="ring" id="rg-env"></span><span class="n">1</span><svg class="svg-ok" width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="step-label">检测环境</div>
        </div>
        <div class="step" id="st-node">
          <div class="step-dot"><span class="ring" id="rg-node"></span><span class="n">2</span><svg class="svg-ok" width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="step-label">Node.js 运行时</div>
        </div>
        <div class="step" id="st-guard">
          <div class="step-dot"><span class="ring" id="rg-guard"></span><span class="n">3</span><svg class="svg-ok" width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="step-label">守卫内核</div>
        </div>
        <div class="step" id="st-panel">
          <div class="step-dot"><span class="ring" id="rg-panel"></span><span class="n">4</span><svg class="svg-ok" width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="step-label">打开面板</div>
        </div>
      </div>

      <!-- 细进度条 -->
      <div class="progress-row" id="progressRow" style="display:none">
        <div class="startup-progress indet" id="bar"><span class="fill" id="fill"></span></div>
        <div class="pct" id="pct"></div>
      </div>

      <!-- 操作区 -->
      <div class="actions" id="actions" style="display:none">
        <button class="btn" id="installBtn" style="display:none">一键安装 Node.js LTS</button>
        <button class="btn ghost" id="skipBtn" style="display:none">跳过并使用现有版本</button>
        <button class="btn ghost" id="retryBtn" style="display:none">重新检测</button>
      </div>
      <pre class="log" id="log"></pre>
      <div class="err" id="err"></div>
    </div>
  </div>

<script>
(function () {
  var core = window.__TAURI__ && window.__TAURI__.core;
  var evt = window.__TAURI__ && window.__TAURI__.event;
  var $ = function (id) { return document.getElementById(id); };
  var STEP = { ENV: 0, NODE: 1, GUARD: 2, PANEL: 3 };
  var cur = STEP.ENV;
  var steps = ['st-env', 'st-node', 'st-guard', 'st-panel'];
  var rings = ['rg-env', 'rg-node', 'rg-guard', 'rg-panel'];
  var lastCore = { installed: null, hint: '' };

  function setStep(idx) {
    cur = Math.max(cur, idx);
    steps.forEach(function (id, i) {
      var el = document.getElementById(id);
      el.classList.remove('active', 'done');
      if (i < cur) el.classList.add('done');
      else if (i === cur) el.classList.add('active');
    });
    $('stepper').style.display = '';
  }
  function ringPct(idx, pct) {
    var el = document.getElementById(rings[idx]);
    if (el) el.style.setProperty('--p', Math.max(0, Math.min(100, pct)));
  }
  function setBar(indet, pct) {
    $('progressRow').style.display = '';
    var bar = $('bar');
    if (indet) { bar.classList.add('indet'); bar.classList.remove('det'); $('pct').textContent = ''; }
    else { bar.classList.remove('indet'); bar.classList.add('det'); $('fill').style.width = Math.max(2, Math.min(100, pct)) + '%'; $('pct').textContent = pct >= 100 ? '' : Math.round(pct) + '%'; }
  }
  function hideBar() { $('progressRow').style.display = 'none'; }

  function applyState(st) {
    if (!st) return;
    var busy = !!st.busy;
    var miss = !st.installed && !busy;
    var old = st.outdated === true && !busy;
    var installed = !!st.installed;

    // 步骤推进
    if (miss || old || busy) {
      setStep(STEP.NODE);
      if (busy) {
        $('status').innerHTML = (st.status || '正在安装 Node.js…');
        $('logo').classList.remove('done');
        setBar(true);
        if (st.progress > 0) { ringPct(STEP.NODE, st.progress * 100); setBar(false, st.progress * 100); }
      } else if (miss) {
        $('status').innerHTML = '缺少 <b>Node.js</b> 运行环境';
        hideBar(); ringPct(STEP.NODE, 0); $('logo').classList.remove('done');
      } else {
        $('status').innerHTML = '检测到 <b>Node.js</b> 旧版本，建议升级';
        hideBar(); ringPct(STEP.NODE, 0); $('logo').classList.remove('done');
      }
    } else if (installed) {
      // Node 达标 → 守卫 → 面板
      $('status').innerHTML = 'Node.js 就绪 · 正在准备守卫…';
      setStep(STEP.GUARD);
      ringPct(STEP.NODE, 100);
      if (lastCore.installed === true) {
        $('status').innerHTML = '环境就绪 · 正在打开面板…';
        setStep(STEP.PANEL);
        $('logo').classList.add('done');
        hideBar();
      }
    } else {
      setStep(STEP.ENV);
      $('status').innerHTML = '正在检测环境…';
      hideBar();
    }

    // 按钮
    if (busy) { $('actions').style.display = 'none'; }
    else if (miss || old) {
      $('actions').style.display = 'grid';
      $('installBtn').disabled = false;
      $('installBtn').textContent = miss ? '一键安装 Node.js LTS' : '升级到官方最新 LTS';
      $('installBtn').style.display = '';
      $('skipBtn').style.display = old ? '' : 'none';
      $('retryBtn').style.display = miss ? '' : 'none';
    } else { $('actions').style.display = 'none'; }

    if (st.logs && st.logs.length) { $('log').style.display = ''; $('log').textContent = st.logs.join(String.fromCharCode(10)); }
    if (st.error) { $('err').style.display = ''; $('err').textContent = '失败：' + st.error; $('actions').style.display = 'grid'; $('installBtn').style.display=''; $('retryBtn').style.display=''; }
    else $('err').style.display = 'none';
  }

  function refresh() {
    if (!core) return;
    core.invoke('node_status').then(function (st) {
      core.invoke('core_status').then(function (cs) { lastCore = cs; applyState(st); }).catch(function () { applyState(st); });
    }).catch(function (e) { $('err').style.display=''; $('err').textContent = '调用失败: ' + e; });
  }

  // 窗口栏
  // 操作
  $('#installBtn').addEventListener('click', function () {
    if (core) core.invoke('start_node_install').catch(function (e) { $('err').style.display=''; $('err').textContent = '启动安装失败: ' + e; });
  });
  $('#skipBtn').addEventListener('click', function () {
    if (core) core.invoke('skip_env_upgrade').catch(function (e) { $('err').style.display=''; $('err').textContent = '跳过失败: ' + e; });
  });
  $('#retryBtn').addEventListener('click', refresh);
  if (evt) {
    evt.listen('env_progress', function (e) { applyState(e.payload || {}); });
    evt.listen('env_done', function (e) {
      applyState({ installed: (e.payload || {}).version, progress: 100 });
      ringPct(STEP.NODE, 100);
      $('logo').classList.add('done');
      $('status').innerHTML = 'Node.js 就绪 · 正在打开面板…';
      hideBar();
    });
    evt.listen('env_error', function (e) { refresh(); });
    evt.listen('env_status', function (e) { refresh(); });
  }
  refresh();
  setInterval(refresh, 4000);
})();
</script>
</body>
</html>
