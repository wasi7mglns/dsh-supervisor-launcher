<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-supervisor — 环境引导</title>
<style>
  :root {
    --blue:#4176e6; --bg:#f4f6fb; --card:#ffffff; --text:#0f1115;
    --muted:#81858c; --border:rgba(0,0,0,0.08);
    --red:#b42318; --green:#10b981;
    --ok-soft:#e7f6ed; --warn-soft:#fef3c7; --danger-soft:#fee2e2;
    --primary-grad: linear-gradient(180deg,#3d5ef0 0%,#2f54eb 100%);
    --primary-grad-hover: linear-gradient(180deg,#4f7bf0 0%,#2f54eb 100%);
    --primary-shadow: 0 1px 2px rgba(15,23,42,0.16), inset 0 1px 0 rgba(255,255,255,0.22);
    --muted-bg: rgba(0,0,0,0.05);
    --glow: radial-gradient(circle at 50% 0%, rgba(65,118,230,0.13), transparent 62%),
            linear-gradient(135deg, rgba(65,118,230,0.05), transparent 60%);
    --font: -apple-system,BlinkMacSystemFont,'Inter','Noto Sans SC',ui-sans-serif,
            system-ui,'PingFang SC','Microsoft YaHei',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --blue:#6b83ff; --bg:#0f1115; --card:#16191f; --text:#f1f4f9;
      --muted:#9aa3ad; --border:rgb(255 255 255/14%);
      --red:#f87171; --green:#34d399;
      --ok-soft:rgba(16,185,129,0.14); --warn-soft:rgba(245,158,11,0.14);
      --danger-soft:rgba(239,68,68,0.14);
      --primary-grad: linear-gradient(180deg,#4f6ef2 0%,#3a56e0 100%);
      --primary-grad-hover: linear-gradient(180deg,#6484f5 0%,#4f6ef2 100%);
      --primary-shadow: 0 1px 2px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.14);
      --muted-bg: rgba(255,255,255,0.06);
      --glow: radial-gradient(circle at 50% 0%, rgba(107,131,255,0.16), transparent 62%),
              linear-gradient(135deg, rgba(107,131,255,0.06), transparent 60%);
    }
  }
  * { box-sizing:border-box; }
  html { background:transparent; }
  body{ margin:0; font-family:var(--font); color:var(--text);
        background:var(--bg); min-height:100vh; min-height:100dvh;
        display:flex; align-items:center; justify-content:center; }
  body::before{ content:''; position:fixed; inset:38px 0 0 0;
               background:var(--glow); pointer-events:none; z-index:0; }
  #tb{ position:fixed; top:0; left:0; right:0; height:38px; display:flex;
       align-items:center; justify-content:space-between; -webkit-app-region:drag;
       user-select:none; z-index:10;
       background:color-mix(in srgb, var(--card) 55%, transparent);
       -webkit-backdrop-filter:blur(12px) saturate(1.4); backdrop-filter:blur(12px) saturate(1.4);
       border-bottom:1px solid var(--border); }
  #tb .tb-title{ padding-left:14px; font-size:12.5px; font-weight:500; color:var(--muted);
                 letter-spacing:.04em; text-transform:uppercase; }
  #tb .tb-btns{ display:flex; height:100%; -webkit-app-region:no-drag; }
  #tb .tb-btns button{ width:44px; height:100%; border:0; background:transparent;
                        color:var(--muted); font-size:15px; cursor:pointer; line-height:1; }
  #tb .tb-btns button:hover{ background:rgba(65,118,230,0.08); color:var(--text); }
  #tb .tb-btns button.tb-close:hover{ background:var(--red); color:#fff; }
  .card{ position:relative; z-index:1; background:var(--card); border:1px solid var(--border);
         border-radius:20px; padding:34px 40px 30px; width:540px;
         box-shadow:0 1px 2px rgba(15,23,42,0.04), 0 16px 48px rgba(15,23,42,0.10),
         inset 0 1px 0 rgba(255,255,255,0.6); }
  .card::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px;
                 background:linear-gradient(90deg, transparent, var(--blue), transparent);
                 border-radius:20px 20px 0 0; opacity:.9; }
  h1{ font-size:21px; margin:0 0 6px; font-weight:650; letter-spacing:-.01em; }
  .sub{ color:var(--muted); font-size:13.5px; margin-bottom:22px; line-height:1.7; }
  .badge{ display:inline-flex; align-items:center; gap:6px; padding:4px 12px;
          border-radius:999px; font-size:12px; font-weight:550; margin-bottom:16px; }
  .badge::before{ content:''; width:6px; height:6px; border-radius:50%;
                  background:currentColor; box-shadow:0 0 6px currentColor; }
  .badge.miss{ background:var(--danger-soft); color:var(--red); }
  .badge.warn{ background:var(--warn-soft); color:#92400e; }
  .badge.ok{ background:var(--ok-soft); color:var(--green); }
  .row{ font-size:13.5px; color:var(--muted); margin:5px 0; display:flex;
        justify-content:space-between; align-items:center; }
  .row b{ color:var(--text); font-family:ui-monospace,menlo,consolas,monospace;
          font-size:13px; background:var(--muted-bg); padding:1px 7px; border-radius:6px; }
  .bar{ height:7px; background:rgba(127,127,127,0.12); border-radius:4px;
        margin:18px 0 8px; overflow:hidden; }
  .fill{ height:100%; width:0; background:linear-gradient(90deg, var(--blue), #6ea5ff);
         border-radius:4px; transition:width .3s cubic-bezier(.4,0,.2,1);
         box-shadow:0 0 8px rgba(65,118,230,0.5); }
  .pct{ font-size:12px; color:var(--muted); text-align:right; }
  .btn{ width:100%; margin-top:18px; padding:12px; border:0; border-radius:10px;
        background:var(--primary-grad); color:#fff; font-size:15px; font-weight:600;
        font-family:inherit; cursor:pointer; box-shadow:var(--primary-shadow);
        transition:filter .15s ease, transform .06s ease; }
  .btn:hover:not(:disabled){ background:var(--primary-grad-hover); filter:brightness(1.04); }
  .btn:active:not(:disabled){ transform:translateY(1px); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--blue);
              margin-top:8px; box-shadow:none; }
  .btn.ghost:hover:not(:disabled){ background:rgba(65,118,230,0.07); filter:none; }
  pre{ background:#0b0e14; color:#8ee6b0; border:1px solid var(--border); border-radius:10px;
       padding:12px 14px; font-size:11.5px; line-height:1.65; max-height:140px; overflow:auto;
       margin:14px 0 0; white-space:pre-wrap; word-break:break-all; }
  .err{ background:var(--danger-soft); color:var(--red); border-radius:10px; padding:11px 14px;
        font-size:12.5px; margin-top:14px; display:none;
        border:1px solid rgba(239,68,68,0.18); }
  .muted{ color:var(--muted); font-size:12px; margin-top:14px; line-height:1.6; }
</style>
</head>
<body>
<div id="tb" data-tauri-drag-region="deep"><span class="tb-title">dsh-supervisor 环境引导</span><span class="tb-btns" data-tauri-drag-region="false"><button id="tbMin">−</button><button id="tbClose" class="tb-close">×</button></span></div>
<div class="card">
  <div id="badge" class="badge miss">检测环境…</div>
  <h1 id="title">dsh-supervisor 环境引导</h1>
  <div class="sub" id="sub">正在检测是否已安装 Node.js（DSH 与守护服务的运行环境）…</div>
  <div class="row">当前 Node：<b id="cur">—</b></div>
  <div class="row">官方最新 LTS：<b id="latest">—</b></div>
  <div class="row">守卫内核：<b id="core">检测中…</b> <span id="coreHint" style="display:none"></span></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="pct" id="pct"></div>
  <button class="btn" id="installBtn" style="display:none">一键安装 Node.js LTS</button>
  <button class="btn ghost" id="skipBtn" style="display:none">跳过并使用现有版本</button>
  <button class="btn ghost" id="retryBtn" style="display:none">重新检测</button>
  <pre id="log" style="display:none"></pre>
  <div class="err" id="err"></div>
  <div class="muted">将下载官方 Node.js 最新 LTS 并安装到系统（需一次管理员授权）。安装完成后守卫将自动启动并打开面板。</div>
</div>
<script>
(function () {
  var core = window.__TAURI__ && window.__TAURI__.core;
  var evt = window.__TAURI__ && window.__TAURI__.event;
  var $ = function (id) { return document.getElementById(id); };
  var lastCore = { installed: null, hint: '' };
  function renderCore() {
    var ok = lastCore.installed === true;
    $('core').textContent = ok ? '已安装' : (lastCore.installed === false ? '未安装' : '检测中…');
    $('core').style.color = ok ? 'var(--green)' : 'var(--red)';
    $('coreHint').textContent = ok ? '' : lastCore.hint;
    $('coreHint').style.display = ok ? 'none' : '';
  }
  function setState(st) {
    $('cur').textContent = st.installed || '未安装';
    $('latest').textContent = st.latest || '获取中…';
    if (st.progress > 0) { $('fill').style.width = (st.progress * 100) + '%'; $('pct').textContent = Math.round(st.progress * 100) + '%'; }
    if (st.status) { $('sub').textContent = st.status; }
    var miss = !st.installed;
    var outdated = st.outdated === true; // 已装但低于官方最新 LTS
    var badge = $('badge');
    badge.className = 'badge ' + (miss ? 'miss' : (outdated ? 'warn' : 'ok'));
    badge.textContent = miss ? '缺少 Node.js' : (outdated ? 'Node.js 可升级' : '环境就绪');
    if (st.busy) { $('installBtn').disabled = true; $('installBtn').textContent = '安装中…'; }
    else if (miss) { $('installBtn').disabled = false; $('installBtn').textContent = '一键安装 Node.js LTS'; }
    else if (outdated) { $('installBtn').disabled = false; $('installBtn').textContent = '升级到官方最新 LTS'; }
    $('installBtn').style.display = (miss || outdated) ? '' : 'none';
    $('skipBtn').style.display = (outdated && !st.busy) ? '' : 'none';
    $('retryBtn').style.display = miss ? '' : 'none';
    if (st.logs && st.logs.length) { $('log').style.display = ''; $('log').textContent = st.logs.join('\n'); }
    if (st.error) { $('err').style.display = ''; $('err').textContent = '失败：' + st.error; $('retryBtn').style.display = ''; }
    else { $('err').style.display = 'none'; }
  }
  function refresh() {
    if (!core) return;
    core.invoke('node_status').then(function (st) {
      core.invoke('core_status').then(function (cs) { lastCore = cs; renderCore(); }).catch(function () {});
      setState(st);
    }).catch(function (e) { $('err').style.display=''; $('err').textContent = '调用失败: ' + e; });
  }
  renderCore();
  $('installBtn').addEventListener('click', function () {
    if (!core) return;
    core.invoke('start_node_install').catch(function (e) { $('err').style.display=''; $('err').textContent = '启动安装失败: ' + e; });
  });
  $('skipBtn').addEventListener('click', function () {
    if (!core) return;
    core.invoke('skip_env_upgrade').catch(function (e) { $('err').style.display=''; $('err').textContent = '跳过失败: ' + e; });
  });
  $('retryBtn').addEventListener('click', refresh);
  if (evt) {
    evt.listen('env_progress', function (e) { setState(e.payload || {}); });
    evt.listen('env_done', function (e) { setState({ installed: (e.payload || {}).version, latest: (e.payload || {}).version, progress: 1 }); $('sub').textContent = 'Node.js 就绪，正在打开面板…'; });
    evt.listen('env_error', function (e) { refresh(); });
    evt.listen('env_status', function (e) { refresh(); });
  }
  refresh();
  // Phase 3b: 无边框窗口控制（win_ctl IPC）
  var core2 = window.__TAURI__ && window.__TAURI__.core;
  if (core2) {
    var wctl = function (a) { core2.invoke('win_ctl', { action: a }).catch(function () {}); };
    var tbMin = document.getElementById('tbMin');
    var tbClose = document.getElementById('tbClose');
    if (tbMin) tbMin.addEventListener('click', function () { wctl('minimize'); });
    if (tbClose) tbClose.addEventListener('click', function () { wctl('hide'); });
  } else {
    var tb = document.getElementById('tb'); if (tb) tb.style.display = 'none';
  }
  setInterval(refresh, 5000);
  setInterval(function () { if (lastCore.installed === null) { core.invoke('core_status').then(function (cs) { lastCore = cs; renderCore(); }).catch(function () {}); } }, 5000);
})();
</script>
</body>
</html>
