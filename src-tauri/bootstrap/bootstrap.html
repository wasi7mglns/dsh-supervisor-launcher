<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-supervisor — 环境引导</title>
<style>
  /* ============================================================
   * dsh-supervisor 引导页（健壮版）
   * 职责单一：检测环境 → 补全 Node → 内核版本治理（强制更新+失败回退）→ 守卫就绪 → 进控制面板。
   * 关键原则：每步真实成败；失败可重试、可诊断；**绝不假成功**。
   * ============================================================ */
  :root {
    --brand: #2F54EB; --brand-soft: rgb(47 84 235 / 12%);
    --text: #0F1115; --status: #6b747d; --line: #DDE3EC; --ok: #10b981; --err: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --brand: #6b83ff; --brand-soft: rgb(107 131 255 / 18%);
      --text: #f1f4f9; --status: #9aa3ad; --line: #262b36; --ok: #34d399; --err: #ff6369; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; height: 100dvh; }
  body { margin: 0; background: transparent; color: var(--text); overflow: hidden;
    font-family: Inter, "Noto Sans SC", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .page { width: 100%; height: 100%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 38%, var(--brand-soft), transparent 32%), #FAFBFC; }
  @media (prefers-color-scheme: dark) {
    .page { background: radial-gradient(circle at 50% 38%, rgb(107 131 255 / 14%), transparent 32%), #0f1115; }
  }
  .inner { display: grid; justify-items: center; gap: 20px; width: min(520px, calc(100% - 48px)); }
  .startup-logo { position: relative; display: grid; width: 72px; height: 72px; place-items: center;
    border: 1px solid rgb(47 84 235 / 14%); border-radius: 999px;
    background: linear-gradient(145deg, rgb(255 255 255 / 96%), rgb(239 245 242 / 92%));
    box-shadow: 0 18px 42px rgb(15 23 42 / 10%), inset 0 1px 0 rgb(255 255 255 / 90%); color: var(--brand); }
  .startup-logo::after { position: absolute; inset: -8px; content: ""; border-radius: 999px;
    border: 2px solid rgb(47 84 235 / 10%); border-top-color: var(--brand); animation: spin 960ms linear infinite; }
  .startup-logo.done::after { animation: none; border-color: rgb(16 185 129 / 30%); border-top-color: var(--ok); }
  .startup-logo-image { width: 46px; height: 46px; background: currentColor;
    mask: url("/dsh-logo.svg") center / contain no-repeat;
    -webkit-mask: url("/dsh-logo.svg") center / contain no-repeat; }
  .startup-name { font-size: 22px; font-weight: 760; line-height: 1; letter-spacing: .02em; }
  .startup-status { color: var(--status); font-size: 13px; line-height: 1.5; text-align: center; min-height: 20px; }
  .steps { display: flex; align-items: center; justify-content: center; gap: 2px; flex-wrap: wrap; }
  .step { display: flex; align-items: center; gap: 6px; color: var(--status); font-size: 12px;
    padding: 5px 9px; border-radius: 999px; transition: all .3s ease; }
  .step .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); flex: none; }
  .step.active { color: var(--text); font-weight: 600; background: rgb(47 84 235 / 8%); }
  .step.active .dot { background: var(--brand); }
  .step.done { color: var(--ok); }
  .step.done .dot { background: var(--ok); }
  .step-arrow { color: var(--line); font-size: 12px; }
  .fail { display: grid; gap: 12px; justify-items: center; width: 100%;
    border: 1px solid color-mix(in srgb, var(--err) 30%, transparent); border-radius: 12px;
    padding: 16px; background: color-mix(in srgb, var(--err) 6%, transparent); }
  .fail-msg { color: var(--text); font-size: 12.5px; line-height: 1.6; text-align: center; word-break: break-word; }
  .fail-actions { display: flex; gap: 8px; }
  .fail-actions button { border: 1px solid var(--line); background: var(--brand); color: #fff;
    border-radius: 8px; padding: 7px 16px; font-size: 12.5px; cursor: pointer; }
  .fail-actions button.ghost { background: transparent; color: var(--status); }
  .choice { display: grid; gap: 10px; justify-items: center; width: 100%;
    border: 1px solid color-mix(in srgb, var(--brand) 32%, transparent); border-radius: 12px;
    padding: 16px; background: color-mix(in srgb, var(--brand) 6%, transparent); }
  .choice-title { font-size: 13.5px; font-weight: 680; color: var(--text); }
  .choice-msg { color: var(--text); font-size: 12.5px; line-height: 1.6; text-align: center; word-break: break-word; }
  .choice-meta { color: var(--status); font-size: 11.5px; line-height: 1.5; text-align: center; }
  .choice-actions { display: flex; gap: 8px; }
  .choice-actions button { border: 1px solid var(--line); background: var(--brand); color: #fff;
    border-radius: 8px; padding: 7px 16px; font-size: 12.5px; cursor: pointer; }
  .choice-actions button.ghost { background: transparent; color: var(--status); }
  /* 下载进度：此前下载阶段**零反馈**（4MB+ 安装包在慢网下长时间无变化），
     用户无法区分「正在下载」与「卡死」——真机实测的主要困惑来源之一。 */
  .progress { width: min(360px, 100%); height: 6px; border-radius: 999px;
    background: color-mix(in srgb, var(--brand) 14%, transparent); overflow: hidden; }
  .progress-bar { height: 100%; width: 0%; border-radius: 999px; background: var(--brand);
    transition: width .25s ease; }
  /* 跳过：**任何网络类步骤都必须给用户即时出口**，否则一旦底层请求挂起，
     用户除了杀进程别无选择（真机卡死的直接后果）。 */
  .skipwrap button { border: 1px solid var(--line); background: transparent; color: var(--status);
    border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .skipwrap button:hover { color: var(--text); }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="page">
    <div class="inner">
      <div class="startup-logo" id="logo" aria-hidden="true"><span class="startup-logo-image"></span></div>
      <div class="startup-name">DSH-SUP</div>
      <div class="startup-status" id="status">正在检测环境…</div>
      <!-- 步骤顺序（2026-09-11 重构）：检测环境 → 运行环境 → 桌面版本 → 内核版本 → 守卫就绪 → 进入控制面板。
           纠正此前的设计错误：曾把「桌面壳自更新」当作第一步（旧称「门 0」），理由是新壳才可能带有
           新的 Node/内核安装要求。该理由不成立：
             · 环境检测与 Node 探测都是**本地**判定，不依赖壳版本；
             · 用户刚手动安装完桌面壳，此时壳已是最新，再强制检查更新毫无意义；
             · 壳更新是**网络**操作（最慢、最不可靠），放在首步会让首次启动直接卡在一个
               可能永不返回的网络请求上（Windows 真机实测完全卡死，无法进入产品）。
           故把本地、快、确定的检查放前面，网络类更新放到环境就绪之后，并全程带超时与可跳过出口。 -->
      <div class="steps" id="steps" style="display:none">
        <span class="step active" id="st-env"><span class="dot"></span>检测环境</span>
        <span class="step-arrow">›</span>
        <span class="step" id="st-node"><span class="dot"></span>运行环境</span>
        <span class="step-arrow">›</span>
        <span class="step" id="st-shell"><span class="dot"></span>桌面版本</span>
        <span class="step-arrow">›</span>
        <span class="step" id="st-core"><span class="dot"></span>内核版本</span>
        <span class="step-arrow">›</span>
        <span class="step" id="st-guard"><span class="dot"></span>守卫就绪</span>
        <span class="step-arrow">›</span>
        <span class="step" id="st-panel"><span class="dot"></span>进入控制面板</span>
      </div>
      <div class="progress" id="prog" style="display:none"><div class="progress-bar" id="progBar"></div></div>
      <div class="skipwrap" id="skipWrap" style="display:none">
        <button id="btnSkipShell">跳过桌面版本检查，直接启动</button>
      </div>
      <div class="fail" id="fail" style="display:none">
        <div class="fail-msg" id="failMsg"></div>
        <div class="fail-actions">
          <button id="btnRetry">重试</button>
          <button id="btnDiag" class="ghost">复制诊断</button>
        </div>
      </div>
      <!-- 桌面版本失败选择页（用户定案 2026-09-11）：
           失败**不静默放行**，给出【重试】【继续使用当前版本】；
           其中【继续】必须始终可用——这是「有界失败即放行」的用户可见形式，
           保证极端情况下用户仍能进入产品（绝不把用户永久挡在门外）。 -->
      <div class="choice" id="updChoice" style="display:none">
        <div class="choice-title">桌面版本更新未完成</div>
        <div class="choice-msg" id="updMsg"></div>
        <div class="choice-meta" id="updMeta"></div>
        <div class="choice-actions">
          <button id="btnUpdRetry">重试更新</button>
          <button id="btnUpdSkip" class="ghost">继续使用当前版本</button>
        </div>
      </div>
    </div>
  </div>
<script>(function () {
  // Tauri API：自身注入优先；作为壳框架(shell.html) iframe 内容时经 parent 访问（同源）。
  var core = (window.__TAURI__ && window.__TAURI__.core)
    || (window.parent && window.parent.__TAURI__ && window.parent.__TAURI__.core)
    || (window.top && window.top.__TAURI__ && window.top.__TAURI__.core) || null;
  var evt = (window.__TAURI__ && window.__TAURI__.event)
    || (window.parent && window.parent.__TAURI__ && window.parent.__TAURI__.event) || null;
  var $ = function (id) { return document.getElementById(id); };
  // 步骤顺序（2026-09-11 重构）：环境 → Node → 桌面版本 → 内核 → 守卫 → 控制面板。
  // 设计纠正：旧顺序把「桌面壳自更新」放在第一步（旧称「门 0」），基于一个不成立的前提
  //（「新壳才可能带有新的 Node/内核安装要求」）—— 环境检测与 Node 探测都是本地判定，
  // 与壳版本无关；且用户刚装完壳，壳本就是最新。把最慢最不可靠的网络步骤放在首位，
  // 会让首次启动直接卡死（Windows 真机实测）。本地快检查在前，网络更新在后。
  var stepNames = ['st-env', 'st-node', 'st-shell', 'st-core', 'st-guard', 'st-panel'];
  var cur = -1;
  var nodeVer = null;      // 当前 Node 版本
  var coreFrom = null;     // 更新前内核版本
  var coreTo = null;       // 更新后内核版本
  var lastPlan = null;     // 最近一次 core_plan（诊断用）
  var lastError = null;
  var shellId = null;      // 壳身份（版本/安装形态/自更新能力/attempt）
  var updPlan = null;      // 最近一次桌面版本检查结果（诊断用）

  function setStep(i, detail) {
    if (i > cur) cur = i;
    stepNames.forEach(function (id, idx) {
      var el = document.getElementById(id);
      if (!el) return;
      var cls = 'step';
      if (idx < cur) cls += ' done';
      else if (idx === cur) cls += ' active';
      el.className = cls;
      if (detail && idx === cur) {
        var d = el.querySelector('.step-detail');
        if (d) d.textContent = detail;
      }
    });
    $('steps').style.display = '';
  }
  function status(t) { $('status').textContent = t; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function hideFail() { $('fail').style.display = 'none'; }

  // ── 下载进度（此前下载阶段零反馈，用户无法区分「在下载」与「卡死」）──
  function showProgress(pct) {
    $('prog').style.display = '';
    $('progBar').style.width = ((pct == null ? 0 : pct) > 100 ? 100 : (pct || 0)) + '%';
  }
  function hideProgress() { $('prog').style.display = 'none'; $('progBar').style.width = '0%'; }

  // ── 超时兜底 ──
  // 为什么必需：Rust 侧已设短超时，但只要任何一层出现「既不 resolve 也不 reject」的情形，
  // 前端 `await` 就会永久挂起，`.catch` 不触发，页面卡死且**没有重试按钮**。
  // 这里再加一层 JS 超时，保证任何情况下都有明确结论（宁可失败放行，绝不静默卡住）。
  var SHELL_CHECK_BUDGET_MS = 45000;   // 检查（Rust 侧 20s + 余量）
  var SHELL_DOWNLOAD_BUDGET_MS = 300000; // 下载前 5 分钟若毫无进展即判定失败（下载本身可更长）
  // 内核步骤同样受网络支配（registry 查询 + npm install），必须同样有界。
  // Rust 侧 http_json 有单请求超时、npm install 现有 15 分钟上限；这里是前端兜底。
  // 环境探测同样可能卡住（探针要执行 node --version；Windows 上 PATH 可能含不可用的存根）。
  // Rust 侧已有 5 秒/候选 + 20 秒全局上限；这里是前端最后一道兜底。
  var ENV_PROBE_BUDGET_MS = 45000;
  var CORE_PLAN_BUDGET_MS = 90000;      // 多镜像回退查询
  var CORE_APPLY_BUDGET_MS = 1020000;   // 17 分钟（Rust 侧 npm install 上限 15 分钟）
  function withTimeout(promise, ms, onTimeoutMsg) {
    return new Promise(function (resolve) {
      var done = false;
      var t = setTimeout(function () {
        if (done) return; done = true;
        resolve({ __timeout: true, error: onTimeoutMsg || '操作超时（无响应）' });
      }, ms);
      promise.then(function (v) {
        if (done) return; done = true; clearTimeout(t); resolve(v);
      }, function (e) {
        if (done) return; done = true; clearTimeout(t); resolve({ __error: String(e) });
      });
    });
  }

  // 跳过按钮：任何网络类步骤都必须给用户即时出口
  var skipAction = null;
  function showSkip(fn) { skipAction = fn; $('skipWrap').style.display = ''; }
  function hideSkip() { skipAction = null; $('skipWrap').style.display = 'none'; }
  // 阶段上报：写入 ~/.dsh/shell/identity.json + shell.log，供内核观察与问题定位。
  // 这是「壳此前零日志、任何打不开都无法诊断」的结构性修复（P0.1/P0.2）。
  function phase(p) {
    try { if (core) core.invoke('shell_set_phase', { phase: p }).catch(function () {}); } catch (e) {}
  }

  // 失败态：显示原因 + 重试 + 诊断（K7——失败不再死锁在引导页）
  function fail(msg) {
    lastError = msg;
    status('启动未完成');
    $('failMsg').textContent = msg;
    $('fail').style.display = '';
  }
  function diagText() {
    return [
      'node=' + (nodeVer || 'unknown'),
      'core_from=' + (coreFrom || 'none'),
      'core_to=' + (coreTo || 'none'),
      'plan=' + (lastPlan ? JSON.stringify(lastPlan) : 'none'),
      'shell=' + (shellId ? (shellId.version + '/' + shellId.installKind + '/capable=' + shellId.selfUpdateCapable) : 'unknown'),
      'shell_attempt=' + (shellId ? shellId.attempt : '?'),
      'shell_pinned=' + (shellId && shellId.pinned ? JSON.stringify(shellId.pinned) : '[]'),
      'shell_update=' + (updPlan ? JSON.stringify({ available: updPlan.available, latest: updPlan.latest, skipped: updPlan.skipped, error: updPlan.error }) : 'none'),
      'error=' + (lastError || 'none'),
    ].join(' | ');
  }

  // 桌面版本失败选择页（用户定案 2026-09-11）：失败**不静默放行**，给出【重试】【继续】；
  // 【继续】必须始终可用——这是「有界失败即放行」的用户可见形式。
  function hideUpdChoice() { $('updChoice').style.display = 'none'; }
  function showUpdChoice(reason) {
    // 注意：变量名不可用 cur —— 外层 cur 是步骤索引，遮蔽会造成步骤条错乱。
    var curVer = (shellId && shellId.version) || "unknown";
    var target = (updPlan && updPlan.latest) || "unknown";
    var kind = (shellId && shellId.installKind) || "unknown";
    $('updMsg').textContent = reason || "更新未能完成";
    $('updMeta').textContent = "当前 " + curVer + " · 目标 " + target + " · 安装形态 " + kind;
    $('updChoice').style.display = '';
  }

  // ── 步骤 2：桌面版本（**在环境就绪之后**，不再是第一步）──
  // 语义：**尽力更新，失败即放行**。原因一律落盘（identity.json / shell.log）。
  // 三平台同一路径：check → download → minisign 验签 → 平台安装 → 重启。
  function stepShellUpdate() {
    var idx = 2; // st-shell 在新顺序中的位置
    setStep(idx);
    phase('shell-update');
    status('正在检查桌面版本…');
    showSkip(function () { skipShellUpdate('用户跳过'); });
    // 双保险：JS 侧超时 + Rust 侧超时，确保任何情况都有结论
    return withTimeout(core.invoke('shell_identity'), 8000, '读取壳身份超时').then(function (id) {
      if (id && !id.__timeout && !id.__error) shellId = id;
      return withTimeout(core.invoke('shell_update_check'), SHELL_CHECK_BUDGET_MS, '检查超时（网络不可达？）');
    }).then(function (r) {
      if (r && r.__timeout) {
        hideSkip();
        status('桌面版本检查超时，继续启动');
        return wait(600).then(stepCorePlan);
      }
      if (r && r.__error) {
        hideSkip();
        status('桌面版本检查异常，继续启动');
        return wait(600).then(stepCorePlan);
      }
      updPlan = r || {};
      // 情形 A：跳过（不可自更新 / 已拉黑 / 达阈值）→ 放行，不打扰用户
      if (r && r.skipped) {
        hideSkip();
        status('已跳过桌面版本检查（' + (r.reason || '') + '）');
        return wait(600).then(stepCorePlan);
      }
      // 情形 B：无更新 → 放行
      if (r && r.available !== true) {
        hideSkip();
        if (r && r.ok === false) {
          status('桌面版本检查失败，继续启动：' + (r.error || '未知'));
          return wait(900).then(stepCorePlan);
        }
        status('桌面壳已是最新（' + ((shellId && shellId.version) || '?') + '）');
        return wait(400).then(stepCorePlan);
      }
      // 情形 C：有更新 → 下载安装（保留跳过出口：下载耗时且可能失败）
      return stepShellApply();
    });
  }

  function skipShellUpdate(why) {
    hideSkip();
    hideProgress();
    status('已跳过桌面版本检查（' + why + '），继续启动');
    try { if (core) core.invoke('shell_set_phase', { phase: 'shell-update-skipped' }); } catch (e) {}
    return wait(500).then(stepCorePlan);
  }

  function stepShellApply() {
    var target = (updPlan && updPlan.latest) || '';
    status('发现桌面新版本 ' + target + ' · 正在下载…');
    showProgress(0);
    // 下载期间持续显示进度；外层超时保证「零进展」时能失败放行而非永久等待。
    return withTimeout(
      core.invoke('shell_update_apply'),
      SHELL_DOWNLOAD_BUDGET_MS,
      '下载长时间无进展',
    ).then(function (r) {
      hideProgress();
      r = r || {};
      if (r.__timeout) {
        showUpdChoice(r.error || '下载超时');
        return null;
      }
      if (r.__error) {
        showUpdChoice('桌面版本调用异常：' + r.__error);
        return null;
      }
      if (r.ok !== true) {
        showUpdChoice('桌面版本更新失败：' + (r.error || '未知'));
        return null; // 停在此页，等用户选择（重试 / 继续）
      }
      hideSkip();
      if (r.upToDate) { return stepCorePlan(); }
      status('桌面新版本已安装（' + (r.installed || target) + '）· 正在重启…');
      return wait(800).then(function () {
        // 重启进入新版本；旧进程装、新进程跑。重启后 version == pendingVersion → 视为成功。
        // 注：Windows 上安装器会由插件直接结束本进程，通常不会走到这里。
        return core.invoke('shell_restart');
      });
    });
  }

  // ── 步骤 1：环境检测 ──
  // ── 步骤 0：环境检测（**第一步**：本地、快、确定）──
  function stepEnv() {
    setStep(0);
    phase('env');
    status('正在检测系统环境…');
    // ⚠ 必须有界（2026-09-11 用户 Windows 真机事故：1.0.3 卡在「检测环境」不动）。
    //   此前只给桌面/内核步骤加了超时，**漏了第一步**，而第一步恰恰最容易卡
    //   （要执行 node --version，Windows PATH 里可能有应用别名存根）。
    return withTimeout(core.invoke('node_status'), ENV_PROBE_BUDGET_MS, '环境检测超时').then(function (st) {
      if (st && st.__timeout) { fail('环境检测超时（探针无响应，可能有异常的可执行文件占位）'); return null; }
      if (st && st.__error) { fail('环境检测异常：' + st.__error); return null; }
      st = st || {};
      if (st.busy) { setStep(1); status(st.status || '正在准备 Node.js 运行环境…'); return stepNodeWait(); }
      if (!st.installed) {
        setStep(1);
        status('未检测到 Node.js · 正在补全运行环境…');
        return core.invoke('start_node_install').then(function () { return stepNodeWait(); });
      }
      nodeVer = st.installed;
      return stepNodeDone();
    });
  }
  function stepNodeWait() {
    phase('node');
    return new Promise(function (resolve) {
      var done = false;
      var t = setInterval(function () {
        core.invoke('node_status').then(function (st) {
          st = st || {};
          if (!st.busy && st.installed) { if (!done) { done = true; clearInterval(t); nodeVer = st.installed; resolve(stepNodeDone()); } }
        }).catch(function () {});
      }, 700);
      // 兜底：Node 安装可能长达数分钟；超时不当作成功（交给后续步骤如实报错）
      setTimeout(function () { if (!done) { done = true; clearInterval(t); resolve(stepNodeDone()); } }, 600000);
    });
  }
  function stepNodeDone() {
    setStep(1);
    status('Node.js ' + (nodeVer || '') + ' 已就绪');
    // 环境就绪后**才**进入桌面版本（网络步骤，带超时与跳过出口）
    return wait(350).then(stepShellUpdate);
  }

  // ── 步骤 3：内核版本治理（强制更新 + 失败回退）──
  function stepCorePlan() {
    setStep(3);
    phase('kernel');
    status('正在检查内核版本…');
    return withTimeout(core.invoke('core_plan'), CORE_PLAN_BUDGET_MS, '内核版本检查超时（网络不可达？）').then(function (p) {
      if (p && p.__timeout) { fail('内核版本检查超时（网络不可达？）'); return null; }
      if (p && p.__error) { fail('内核版本检查异常：' + p.__error); return null; }
      lastPlan = p || {};
      coreFrom = p.installed || null;
      if (!p.installed) {
        status('未安装内核 · 正在安装标准产品包…');
        return coreApply(null);
      }
      if (p.action === 'upgrade' && p.latest) {
        status('发现新内核 v' + p.latest + '（当前 v' + p.installed + '）· 正在强制更新…');
        return coreApply(p.latest);
      }
      status('内核已是最新（v' + p.installed + '）');
      coreTo = p.installed;
      return wait(300).then(stepCoreDone);
    }).catch(function (e) { fail('内核版本检查失败：' + e); });
  }

  // 执行安装/升级/回退；成功返回 true，失败走 fail() 并返回 false
  function coreApply(version) {
    // 有界：Rust 侧 npm install 上限 15 分钟，此处 17 分钟兜底（含镜像回退与解包）。
    return withTimeout(core.invoke('core_apply', { version: version }), CORE_APPLY_BUDGET_MS, '内核安装超时（已中止等待）').then(function (r) {
      if (r && r.__timeout) { fail('内核安装超时（超过 17 分钟未完成）'); return false; }
      if (r && r.__error) { fail('内核安装异常：' + r.__error); return false; }
      if (!r || r.ok !== true) {
        fail('内核' + (coreFrom ? '更新' : '安装') + '失败：' + ((r && r.error) || '未知错误'));
        return false;
      }
      coreTo = r.version;
      // 校验确实生效：防「装到了别的前缀」（跨平台 npm prefix 不一致的典型症状）
      return core.invoke('core_status').then(function (st) {
        st = st || {};
        if (st.version === r.version) return stepCoreDone();
        fail('内核已安装 v' + r.version + '，但检测到的是 v' + (st.version || '未知') + '（安装前缀不一致）');
        return false;
      });
    }).catch(function (e) { fail('内核安装异常：' + e); return false; });
  }

  function stepCoreDone() {
    setStep(3);
    status('内核 v' + (coreTo || coreFrom || '') + ' 已就绪');
    return wait(300).then(stepGuardStart);
  }

  // ── 步骤 3：守卫就绪（TCP + HTTP 双确认，替代固定延时）──
  function stepGuardStart() {
    setStep(4);
    phase('guard');
    status('正在启动守卫…');
    return core.invoke('guard_start').then(function (r) {
      if (!r || r.ok !== true) return guardFailed('守卫启动失败：' + ((r && r.error) || '未知'));
      return stepGuardReady(0);
    }).catch(function (e) { return guardFailed('守卫启动异常：' + e); });
  }
  function stepGuardReady(n) {
    if (n === 0) status('等待守卫就绪…');
    return core.invoke('guard_ready').then(function (r) {
      r = r || {};
      if (r.ready) return stepPanel();
      if (n >= 40) return guardFailed('守卫未就绪（端口 ' + (r.port || '?') + ' 无响应）');
      return wait(500).then(function () { return stepGuardReady(n + 1); });
    }).catch(function () {
      if (n >= 40) return guardFailed('守卫就绪探测失败');
      return wait(500).then(function () { return stepGuardReady(n + 1); });
    });
  }
  // 方案 B：本次发生过升级且守卫起不来 → 回退旧版本再试一次（旧版仍可从镜像装回）
  function guardFailed(msg) {
    if (coreFrom && coreTo && coreFrom !== coreTo) {
      status('守卫未就绪 · 正在回退内核 v' + coreFrom + '…');
      return core.invoke('core_apply', { version: coreFrom }).then(function (r) {
        if (!r || r.ok !== true) { fail(msg + '；回退亦失败：' + ((r && r.error) || '未知')); return null; }
        coreTo = coreFrom; // 已回退：再次失败将直接进入失败态（不再循环回退）
        return core.invoke('guard_start').then(function () { return stepGuardReady(0); });
      }).catch(function (e) { fail(msg + '；回退异常：' + e); return null; });
    }
    fail(msg);
    return null;
  }

  // ── 步骤 5：进入控制面板（= 健康确认：内核据此确认桌面版本更新成功 / 清 journal）──
  function stepPanel() {
    setStep(5);
    phase('ready');   // 关键：这是「壳已健康启动」的确认信号
    status('环境就绪 · 正在打开控制面板…');
    $('logo').classList.add('done');
    return wait(700).then(function () { if (core) core.invoke('finish_boot').catch(function () {}); });
  }

  function boot() {
    if (!core) return;
    hideFail();
    hideUpdChoice();
    cur = -1; nodeVer = null; coreFrom = null; coreTo = null; lastError = null; updPlan = null;
    // 从**环境检测**开始（本地快检查在前）；随后 Node → 桌面版本 → 内核 → 守卫 → 控制面板。
    stepEnv().catch(function (e) { fail('引导异常：' + e); });
  }

  // 交互：桌面版本失败选择页（用户已确认的定案）
  //   【重试】重新尝试安装（手动重试是明确意图，给足预算）；
  //   【继续】始终可用，进入引导后续步骤（有界失败即放行的用户可见形式）。
  $('btnUpdRetry').addEventListener('click', function () {
    hideUpdChoice();
    status('正在重试桌面版本更新…');
    stepShellApply().catch(function (e) { showUpdChoice('重试异常：' + e); });
  });
  $('btnUpdSkip').addEventListener('click', function () {
    hideUpdChoice();
    status('已选择继续使用当前版本');
    try { if (core) core.invoke('shell_set_phase', { phase: 'shell-update-skipped' }); } catch (e) {}
    stepCorePlan().catch(function (e) { fail('引导异常：' + e); });
  });

  // 交互：跳过（网络步骤的即时出口）
  $('btnSkipShell').addEventListener('click', function () {
    if (skipAction) skipAction();
  });

  // 交互：重试 / 诊断
  $('btnRetry').addEventListener('click', function () { boot(); });
  $('btnDiag').addEventListener('click', function () {
    var t = diagText();
    try { if (navigator.clipboard) navigator.clipboard.writeText(t); } catch (e) {}
    status('诊断信息已复制：' + t);
  });

  // 下载进度（Rust 侧 shell_update_apply 通过 shell_update_progress 上报）
  // 此前该事件无人监听、且 Rust 侧回调体为空 → 下载全程零反馈。
  if (evt) {
    evt.listen('shell_update_progress', function (e) {
      var p = e.payload || {};
      if (p.installing) { status('下载完成 · 正在安装…'); showProgress(100); return; }
      var total = p.total || 0;
      var got = p.downloaded || 0;
      if (total > 0) {
        var pct = Math.floor((got / total) * 100);
        showProgress(pct);
        status('正在下载桌面版本 ' + pct + '%（' + Math.round(got / 1048576 * 10) / 10 + ' / ' + Math.round(total / 1048576 * 10) / 10 + ' MB）…');
      } else {
        showProgress(null);
        status('正在下载桌面版本（' + Math.round(got / 1048576 * 10) / 10 + ' MB）…');
      }
    });
  }
  if (evt) {
    evt.listen('env_progress', function (e) {
      var p = e.payload || {};
      if (p.busy) { setStep(1); status(p.status || '正在安装 Node.js…'); }
    });
    evt.listen('env_error', function (e) {
      var p = (e && e.payload) || {};
      fail('运行环境安装失败：' + (p.error || '未知'));
    });
  }

  boot();
})();</script>
</body>
</html>
